name: Release - Please
on:
  workflow_call:
    outputs:
      release_created:
        value: ${{ jobs.release.outputs.release_created }}
      version:
        value: ${{ jobs.release.outputs.version }}
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      prs: ${{ steps.release.outputs.prs }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release dependency gate
        id: dependencies
        run: python3 tools/release/dependency_gate.py --next --github-output "$GITHUB_OUTPUT"
      - name: Release Please
        if: steps.dependencies.outputs.ready == 'true'
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  check-release-prs:
    needs: release
    if: needs.release.outputs.prs_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      # This job needs dispatch rights, but cannot write repository contents and
      # never checks out or executes release-branch code. The publishing job has
      # no Actions write permission. Bot PRs still receive explicit CI dispatch.
      - name: Check release PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0; shared with Studio
        env:
          RELEASE_PRS: ${{ needs.release.outputs.prs }}
        with:
          script: |
            for (const pr of JSON.parse(process.env.RELEASE_PRS)) {
              if (pr.baseBranchName !== 'main' || !pr.headBranchName.startsWith('release-please--')) {
                throw new Error('Unexpected release PR branch');
              }
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo, workflow_id: 'ci.yml', ref: pr.headBranchName,
              });
            }
