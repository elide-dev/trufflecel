name: Release - Please
on:
  workflow_call:
    outputs:
      release_created:
        value: ${{ jobs.release.outputs.release_created }}
      version:
        value: ${{ jobs.release.outputs.version }}
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release dependency gate
        id: dependencies
        run: python3 tools/release/dependency_gate.py --next --github-output "$GITHUB_OUTPUT"
      - name: Release Please
        if: steps.dependencies.outputs.ready == 'true'
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Explicit dispatch makes release-branch checks independent of bot PR event behavior.
      - name: Check release PRs
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0; shared with Studio
        env:
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        with:
          script: |
            for (const pr of JSON.parse(process.env.RELEASE_PRS)) {
              if (pr.baseBranchName !== 'main' || !pr.headBranchName.startsWith('release-please--')) {
                throw new Error('Unexpected release PR branch');
              }
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo, workflow_id: 'ci.yml', ref: pr.headBranchName,
              });
            }
