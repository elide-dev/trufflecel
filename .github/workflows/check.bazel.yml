name: Check - Bazel
on:
  workflow_call:
    secrets:
      BUILDBUDDY_API_KEY:
        required: false
      BUILDBUDDY_APIKEY:
        required: false
      CODECOV_TOKEN:
        required: false
permissions:
  contents: read
  id-token: write
jobs:
  jvm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure BuildBuddy
        env:
          BUILDBUDDY_API_KEY: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (secrets.BUILDBUDDY_API_KEY || secrets.BUILDBUDDY_APIKEY) || '' }}
        run: .github/scripts/configure-buildbuddy.sh
      - name: Install Bazelisk
        run: .github/scripts/install-bazelisk.sh
      - name: Validate GitHub Actions workflows
        run: .github/scripts/install-actionlint.sh
      - name: Check CI and benchmark tooling
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 -m unittest discover -s tools/bench -p 'test_*.py'
      - name: Check generated targets
        run: bazel run //bazel/gazelle:check
      - name: Check Java formatting
        run: bazel run //tools:format -- --check
      - name: Build and test
        id: tests
        run: bazel test //...
      - name: Preserve JUnit results
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: python3 .github/scripts/reports.py junit
      - name: JVM coverage
        id: coverage
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: bazel coverage //src/test/...
      - name: Validate LCOV
        id: lcov
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        run: python3 .github/scripts/reports.py coverage
      - name: Enforce coverage
        if: ${{ !cancelled() && steps.lcov.outcome == 'success' }}
        run: bazel run //tools:coverage
      - name: Upload JVM coverage to Codecov
        if: ${{ !cancelled() && steps.lcov.outcome == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1; shared with TruffleData
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          slug: ${{ github.repository }}
          files: build/reports/coverage/lcov.info
          disable_search: true
          flags: jvm
          fail_ci_if_error: true
          cleanup: true
      - name: Upload JVM test results to Codecov
        if: ${{ !cancelled() && hashFiles('build/reports/junit.xml') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1; shared with TruffleData
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          slug: ${{ github.repository }}
          files: build/reports/junit.xml
          report_type: test_results
          disable_search: true
          flags: jvm
          fail_ci_if_error: true
          cleanup: true
      - name: Build library JARs and Maven publications
        run: bazel build //:trufflecel //:trufflecel-protobuf //:trufflecel-json //tools/release:publications
      - name: Upload JAR and reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trufflecel-jvm
          path: |
            bazel-bin/src/main/java/dev/trufflecel/libtrufflecel.jar
            bazel-bin/src/main/java/dev/trufflecel/libprotobuf.jar
            bazel-bin/src/main/java/dev/trufflecel/libjson.jar
            bazel-bin/tools/release/core/dev/elide/**
            bazel-bin/tools/release/protobuf/dev/elide/**
            bazel-bin/tools/release/json/dev/elide/**
            build/reports/
            bazel-out/_coverage/_coverage_report.dat
            bazel-testlogs/**/test.xml
            bazel-testlogs/**/test.log
      - name: Remove credentials
        if: always()
        run: rm -f user.bazelrc
  native-jit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reserve disk for guest compiler
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet
      - name: Configure BuildBuddy
        env:
          BUILDBUDDY_API_KEY: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (secrets.BUILDBUDDY_API_KEY || secrets.BUILDBUDDY_APIKEY) || '' }}
        run: .github/scripts/configure-buildbuddy.sh
      - name: Install Bazelisk
        run: .github/scripts/install-bazelisk.sh
      - name: Enforce native blocklist and guest compilation
        id: tests
        run: |
          bazel test //benchmarks:jit_smoke //benchmarks/representative:native_smoke
          # Bound concurrent Native Image builds on fork runners without RBE.
          bazel test //benchmarks/representative:startup_native_runtime_smoke
          bazel test //benchmarks/representative:startup_native_image_smoke
      - name: Collect native JIT test results
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: python3 .github/scripts/reports.py junit
      - name: Upload native JIT test results to Codecov
        if: ${{ !cancelled() && hashFiles('build/reports/junit.xml') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1; shared with TruffleData
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          use_oidc: ${{ secrets.CODECOV_TOKEN == '' }}
          slug: ${{ github.repository }}
          files: build/reports/junit.xml
          report_type: test_results
          disable_search: true
          flags: native-jit
          fail_ci_if_error: true
          cleanup: true
      - name: Preserve native JIT results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trufflecel-native-jit
          path: |
            build/reports/
            bazel-testlogs/benchmarks/jit_smoke/test.log
            bazel-testlogs/benchmarks/jit_smoke/test.xml
            bazel-testlogs/benchmarks/representative/native_smoke/test.log
            bazel-testlogs/benchmarks/representative/native_smoke/test.xml
            bazel-testlogs/benchmarks/representative/startup_native_runtime_smoke/test.log
            bazel-testlogs/benchmarks/representative/startup_native_runtime_smoke/test.xml
            bazel-testlogs/benchmarks/representative/startup_native_image_smoke/test.log
            bazel-testlogs/benchmarks/representative/startup_native_image_smoke/test.xml
      - name: Remove credentials
        if: always()
        run: rm -f user.bazelrc
