# trufflecheck policy for TruffleCEL (https://github.com/elide-dev/trufflecheck#tell-the-rules-about-your-project).
# Defaults: META-INF/trufflecheck/policy.properties in trufflecheck-errorprone. Paths are relative to this file.

# Guest-implementation packages: TruffleCEL's language and nodes. Tests, benchmarks and tools are embedders and
# legitimately use the polyglot API.
hostinterop.scope=dev.trufflecel
hostinterop.exclude=.*/(src/test|benchmarks|tools)/.*

# Stack traces matter only on paths Truffle compiles. Keep the default test exclusion and add the host-only benchmark
# harnesses and build tools, which never run as guest code.
stackful.exclude=.*/(test|tests|testFixtures|testing|benchmarks|tools)/.*

# Native Image class initialization, mirroring the --initialize-at-* flags in benchmarks/**/BUILD.bazel. TruffleCEL
# ships no native-image.properties of its own; these lists describe how every image in this repository builds it.
classinit.buildtime=classinit-buildtime.txt
classinit.runtime=classinit-runtime.txt
